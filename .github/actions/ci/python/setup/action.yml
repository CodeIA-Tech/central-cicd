name: "Setup Python CI"
description: "Configure Python environment for CI and install dependencies"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  requirements-file:
    description: "Path to requirements file; the default is optional"
    required: false
    default: "requirements.txt"

runs:
  using: "composite"
  steps:   

    - name: "Setup Python"
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
  
    - name: "Install Dependencies"
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: |
        python -m pip install --upgrade pip
        if [ -f "$REQUIREMENTS_FILE" ]; then
          python -m pip install -r "$REQUIREMENTS_FILE"
        elif [ "$REQUIREMENTS_FILE" != "requirements.txt" ]; then
          echo "::error::Requirements file not found: $REQUIREMENTS_FILE"
          exit 1
        fi

