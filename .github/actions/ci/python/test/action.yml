name: "Test Python CI"
description: "Run Python tests in CI environment"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run lint
      run: |
        if [ -f requirements.txt ]; then pip install flake8; fi
        flake8 .

    - name: Run tests
      run: |
        if [ -f tests/ ]; then pytest tests/; fi
