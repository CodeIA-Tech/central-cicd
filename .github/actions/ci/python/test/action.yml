name: "Test Python CI"
description: "Run Python tests in CI environment"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  requirements-file:
    description: "Path to requirements file; the default is optional"
    required: false
    default: "requirements.txt"
  tests-directory:
    description: "Directory containing pytest tests"
    required: false
    default: "tests"
  require-tests:
    description: "Fail if the tests directory is absent"
    required: false
    default: "false"
  run-lint:
    description: "Run Flake8, Black and isort"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        REQUIRE_TESTS: ${{ inputs.require-tests }}
        RUN_LINT: ${{ inputs.run-lint }}
        TESTS_DIRECTORY: ${{ inputs.tests-directory }}
      run: |
        for value in "$REQUIRE_TESTS" "$RUN_LINT"; do
          if [ "$value" != "true" ] && [ "$value" != "false" ]; then
            echo "::error::require-tests and run-lint must be true or false"
            exit 1
          fi
        done
        if [ -z "$TESTS_DIRECTORY" ]; then
          echo "::error::tests-directory must not be empty"
          exit 1
        fi

    - name: Install dependencies
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        RUN_LINT: ${{ inputs.run-lint }}
      run: |
        python -m pip install --upgrade pip
        if [ -f "$REQUIREMENTS_FILE" ]; then
          python -m pip install -r "$REQUIREMENTS_FILE"
        elif [ "$REQUIREMENTS_FILE" != "requirements.txt" ]; then
          echo "::error::Requirements file not found: $REQUIREMENTS_FILE"
          exit 1
        fi
        python -m pip install pytest
        if [ "$RUN_LINT" = "true" ]; then
          python -m pip install flake8 black isort
        fi
    
    - name: Run lint
      if: inputs.run-lint == 'true'
      shell: bash
      run: |
        python -m flake8 .
    
    - name: Run black
      if: inputs.run-lint == 'true'
      shell: bash
      run: |
        python -m black --check .
    
    - name: Run isort
      if: inputs.run-lint == 'true'
      shell: bash
      run: |
        python -m isort --check-only .
    
    - name: Run pytest
      shell: bash
      env:
        TESTS_DIRECTORY: ${{ inputs.tests-directory }}
        REQUIRE_TESTS: ${{ inputs.require-tests }}
      run: |
        if [ -d "$TESTS_DIRECTORY" ]; then
          python -m pytest -- "$TESTS_DIRECTORY"
        elif [ "$REQUIRE_TESTS" = "true" ]; then
          echo "::error::Tests directory not found: $TESTS_DIRECTORY"
          exit 1
        else
          echo "Tests directory not found; skipping pytest: $TESTS_DIRECTORY"
        fi
