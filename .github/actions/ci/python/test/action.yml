name: "Test Python CI"
description: "Run Python tests in CI environment"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run lint
      shell: bash
      run: |
        if [ -f requirements.txt ]; then pip install flake8; fi
        flake8 .
    - name: Run black
      shell: bash
      run: |
        if [ -f requirements.txt ]; then pip install black; fi
        black --check .
    - name: Run isort
      shell: bash
      run: |
        if [ -f requirements.txt ]; then pip install isort; fi
        isort .
    - name: Run pytest
      shell: bash
      run: |
        if [ -f tests/ ]; then pytest tests/; fi
