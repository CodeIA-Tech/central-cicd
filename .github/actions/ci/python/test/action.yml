name: "Test Python CI"
description: "Run Python tests in CI environment"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -m pip install flake8 black isort pytest
    
    - name: Run lint
      shell: bash
      run: |
        python -m flake8 .
    
    - name: Run black
      shell: bash
      run: |
        python -m black --check .
    
    - name: Run isort
      shell: bash
      run: |
        python -m isort --check-only .
    
    - name: Run pytest
      shell: bash
      run: |
        if [ -d tests/ ]; then python -m pytest tests/; fi
